[package]
name = "waifu-api-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = "0.4.45"
futures = "0.3.34"
image = "0.25.10"
log = "0.4.34"
rand = "0.10.3"
serde = "1.0.229"
serde_json = "1.0.151"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.21"
tokio = "1.53.1"
wreq = { version = "0.15.3", features = ["json"] }
wreq-util = "0.1.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
