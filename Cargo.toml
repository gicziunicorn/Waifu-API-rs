[package]
name = "waifu-api"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
futures = "0.3.34"
image = "0.25.10"
log = "0.4.34"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.21"
tokio = "1.53.3"
wreq = { version = "0.16.1", features = ["json"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt"] }
